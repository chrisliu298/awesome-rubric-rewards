name: verify-titles

# Papers in this area are retitled between arXiv versions unusually often, and every
# catch so far has been a human noticing. This makes it mechanical.

on:
  pull_request:
    paths: ["README.md", "papers.tsv"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Offline: manifest covers every README entry, no duplicate IDs, no stale rows.
      - name: Manifest covers README
        run: python3 scripts/build_manifest.py check

      # Network: re-resolve every ID and fail on drift. Scheduled runs only --
      # 780+ sequential fetches is too slow to gate a PR on.
      - name: Stored titles still match arXiv
        if: github.event_name != 'pull_request'
        run: python3 scripts/build_manifest.py verify "$(date -u +%Y-%m-%d)"
